name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: tests (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Mod files parse
        run: for f in mods/*/*.js; do node --check "$f" || exit 1; done
      - name: Layout, theme, keys and manifests are JSON
        run: node -e "const fs=require('fs'); for (const f of ['layouts/rgb.json','themes/rgb.json','keys.json',...fs.readdirSync('mods').map(m=>'mods/'+m+'/mod.json')]) JSON.parse(fs.readFileSync(f,'utf8'))"
      - name: Test
        run: npm test
